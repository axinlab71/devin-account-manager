name: Verify Windows desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: rustup default 1.92.0
      - run: npm ci
      - run: npm run build
      - run: npm run test:quota
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: npx playwright install chromium
      - run: node scripts/ci-ui.cjs
      - run: npm run tauri -- build --bundles nsis
