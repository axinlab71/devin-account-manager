name: Release Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: rustup default 1.92.0
      - name: "Guard: tag must match app version"
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match tauri.conf.json version '$version' — bump the version or retag."
          }
      - run: npm ci
      - run: npm run build
      - run: npm run test:quota
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: npm run tauri -- build --bundles nsis
      - name: Checksum installer
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under $bundle" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -FilePath "$bundle/SHA256SUMS.txt" -Encoding ascii
          Write-Output "Built $($exe.Name) sha256=$hash"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $files = @(
            (Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1).FullName,
            "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"
          )
          $prerelease = if ($tag -match '-') { @('--prerelease') } else { @() }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "$tag" --generate-notes @prerelease
          }
